<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontak - Desa Sepinggan Gelik</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #effcf4;
            color: #145c35;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .contact-section {
            padding: 40px 0 60px;
        }

        .subtitle {
            text-align: center;
            color: #16c45b;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .title {
            text-align: center;
            font-size: 56px;
            color: #145c35;
            margin-bottom: 65px;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 35px;
        }

        /* Kartu informasi */
        .contact-card {
            background: white;
            padding: 60px 50px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .contact-card h2 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #075b32;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 28px;
            font-size: 23px;
            color: #55779d;
        }

        .icon {
            font-size: 25px;
            width: 25px;
            flex-shrink: 0;
        }

        /* Kartu Google Maps */
        .map-card {
            background: #dbeaff;
            border-radius: 25px;
            min-height: 450px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .map-card iframe {
            width: 100%;
            height: 450px;
            border: 0;
            display: block;
        }

        /* Tampilan HP */
        @media (max-width: 800px) {

            .contact-wrapper {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 40px;
                margin-bottom: 40px;
            }

            .contact-card {
                padding: 35px 25px;
            }

            .contact-card h2 {
                font-size: 30px;
            }

            .contact-item {
                font-size: 18px;
            }

            .map-card {
                min-height: 350px;
            }

            .map-card iframe {
                height: 350px;
            }
        }
    </style>
</head>

<body>

    <section class="contact-section">

        <div class="container">

            <!-- Judul halaman -->
            <div class="subtitle">
                KONTAK
            </div>

            <h1 class="title">
                Hubungi Desa
            </h1>

            <div class="contact-wrapper">

                <!-- Informasi Kantor Desa -->
                <div class="contact-card">

                    <h2>
                        Kantor Desa Sepinggan Gelik
                    </h2>

                    <div class="contact-item">
                        <span class="icon">📍</span>
                        <span>
                            Alamat: Masukkan alamat lengkap desa
                        </span>
                    </div>

                    <div class="contact-item">
                        <span class="icon">📞</span>
                        <span>
                            Telepon: 08xxxxxxxxxx
                        </span>
                    </div>

                    <div class="contact-item">
                        <span class="icon">✉️</span>
                        <span>
                            Email: desa@example.com
                        </span>
                    </div>

                    <div class="contact-item">
                        <span class="icon">🕐</span>
                        <span>
                            Jam pelayanan: Senin - Jumat, 08.00 - 15.00
                        </span>
                    </div>

                </div>


                <!-- Google Maps -->
                <div class="map-card">

                    <iframe
                        src="https://www.google.com/maps?q=Sepinggan+Gelik&output=embed"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>

                </div>

            </div>

        </div>

    </section>

</body>
</html>
