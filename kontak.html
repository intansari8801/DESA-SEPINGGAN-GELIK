<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontak - Desa Sepinggan Gelik</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #effcf4;
            color: #145c35;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .contact-section {
            padding: 35px 0 60px;
        }

        .subtitle {
            text-align: center;
            color: #16c45b;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .title {
            text-align: center;
            font-size: 56px;
            color: #145c35;
            margin-bottom: 65px;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 35px;
        }

        .contact-card {
            background: white;
            padding: 60px 50px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .contact-card h2 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #075b32;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 28px;
            font-size: 23px;
            color: #55779d;
        }

        .icon {
            font-size: 25px;
            width: 25px;
        }

        .map-card {
            background: #dbeaff;
            border-radius: 25px;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .map-icon {
            font-size: 55px;
            margin-bottom: 30px;
        }

        .map-card h2 {
            color: #111;
            font-size: 30px;
            margin-bottom: 18px;
        }

        .map-card p {
            color: #111;
            font-size: 23px;
            margin-bottom: 30px;
        }

        .map-button {
            display: inline-block;
            background: #20c765;
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: bold;
            padding: 22px 38px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .map-button:hover {
            background: #159e4e;
            transform: translateY(-2px);
        }

        @media (max-width: 800px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 40px;
                margin-bottom: 40px;
            }

            .contact-card {
                padding: 35px 25px;
            }

            .contact-card h2 {
                font-size: 30px;
            }

            .contact-item {
                font-size: 18px;
            }

            .map-card p {
                font-size: 18px;
            }

            .map-button {
                font-size: 18px;
                padding: 18px 25px;
            }
        }
    </style>
</head>

<body>

    <section class="contact-section">

        <div class="container">

            <!-- Judul -->
            <div class="subtitle">
                KONTAK
            </div>

            <h1 class="title">
                Hubungi Desa
            </h1>


            <div class="contact-wrapper">

                <!-- Informasi Kantor Desa -->
                <div class="contact-card">

                    <h2>
                        Kantor Desa Sepinggan Gelik
                    </h2>

                    <div class="contact-item">
                        <span class="icon">📍</span>
                        <span>
                            Alamat: Masukkan alamat lengkap desa
                        </span>
                    </div>

                    <div class="contact-item">
                        <span class="icon">📞</span>
                        <span>
                            Telepon: 08xxxxxxxxxx
                        </span>
                    </div>

                    <div class="contact-item">
                        <span class="icon">✉️</span>
                        <span>
                            Email: desa@example.com
                        </span>
                    </div>

                    <div class="contact-item">
                        <span class="icon">🕐</span>
                        <span>
                            Jam pelayanan: Senin - Jumat, 08.00 - 15.00
                        </span>
                    </div>

                </div>


                <!-- Lokasi -->
                <div class="map-card">

                    <div class="map-icon">
                        📍
                    </div>

                    <h2>
                        Lokasi Desa
                    </h2>

                    <p>
                        Desa Sepinggan Gelik
                    </p>

                    <!-- Tombol Google Maps -->
                    <a
                        href="https://maps.app.goo.gl/fsnvnymFf8NdKBVTA"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="map-button"
                    >
                        Buka Google Maps
                    </a>

                </div>

            </div>

        </div>

    </section>

</body>
</html>
